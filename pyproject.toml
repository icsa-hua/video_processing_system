# THIS IS THE FIX:
[tool.poetry]
packages = [
    { include = "obs_system" }
]

[project]
name = "VIDPS"
version = "0.2.0"
description = "This is a rectilinear/fisheye video processing, obstacle recognition system, based on Yolov8, running on TensorRT with FP16 engine and ONNX compression."
authors = [
    {name = "Dimitrios Georgiadis",email = "dgeorgiadis@hua.gr"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics (>=8.4.7,<9.0.0)",
    "onnx (>=1.20.1,<2.0.0)",
    "numpy (==2.2.6)",
    "opencv-python (==4.11.0.86)",
    "onnxruntime (==1.23.2)",
    "seaborn (==0.13.2)",
    "torch (>=2.0.0)",
    "torchvision (==0.20.1)",
    "viztracer (==1.0.0)",
    "fastapi (>=0.128.0,<0.129.0)",
    "fastimport (>=0.9.16,<0.10.0)",
    "streamlit (>=1.53.1,<2.0.0)",
    "supervision (>=0.27.0,<0.28.0)",
    "toml (>=0.10.2,<0.11.0)",
    "tqdm (>=4.67.1,<5.0.0)"
]



[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
