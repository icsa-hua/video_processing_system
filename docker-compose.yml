services:
  obs_vps_app_v2:
    build: .
    image: obs-inference-jetson:tensorrt-arm64
    container_name: dev_cont
    runtime: nvidia

    volumes:
      - ./:/workspace
      - venv:/opt/venv
      - ./assets/compressed_models:/app/models/
      - /run:/run

    ports: 
      - "8503:8503" 
      - "8504:8504"

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - VENV_PATH=/opt/venv
      - PIP_INDEX_URL=https://pypi.org/simple
      - MALLOC_CHECK=0 
      - OPENBLAS_CORETYPE=ARMV8
      - LD_PRELOAD=

    ipc: host
    shm_size: "1gb"
    tty: true 
    stdin_open: true

    command: >
      bash -lc "
        set -e;
        cd /workspace; 
        python3 -V;
        python3 -m pip install --ignore-installed blinker streamlit fastapi "uvicorn[standard]"
        if [ -f setup.py ]; then
          echo 'Setting up OBS package...';
          python3 -m pip install -e . --no-deps;
        fi;
        if [ -f requirements.txt ]; then 
          python3 -m pip install -r requirements.txt --no-deps; 
          python3 -m pip install --upgrade pyparsing --no-deps; 
          python3 -m pip install nvidia-ml-py --no-deps; 
        fi; 
        echo '[docker-compose]: Environment Setup Completed...'; 
        tail -f /dev/null; 
      "

volumes:
  venv:

